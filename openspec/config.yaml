context: |
  ThinkingHome.NooLite — .NET-библиотека управления устройствами nooLite / nooLite-F через
  адаптер MTRF-64-USB (System.IO.Ports, 9600, 17-байтные пакеты). Проекты: библиотека
  (NuGet ThinkingHome.NooLite), Console (dotnet tool `noolite`, McMaster.Extensions.CommandLineUtils),
  DebugConsole (отладочная консоль с режимами ports/listen/on/off/bind/bind-rx/clear/state и др.),
  Tests (xUnit 2.9 + VSTest, 76 тестов). net10.0, версия пакета 5.0.0 (мажорный релиз 2026-08-18,
  коммит «релиз 5»); публикуется в NuGet; CI — GitHub Actions (build & tests).
  История изменений и указания по миграции — CHANGELOG.md (ведётся с 5.0.0, формат
  Keep a Changelog, на русском; версии ниже 5.0.0 не восстанавливались).

  Потребитель: драйвер NooLite для хаба ThinkingHome.DeviceModel (репозиторий D:\Source\device-model),
  подключает библиотеку как NuGet-зависимость. Исходный контекст, факты протокола MTRF-64
  и разделение ответственности библиотека/драйвер — в docs/device-model-handoff.md (исторический
  документ 2026-08-14; все три его пункта выполнены).

  Устройство адаптера (MTRFXXAdapter): таймер каждые 50 мс под lockObject читает 17-байтные
  пакеты из порта и кладёт сырые байты в Channel<byte[]> (bounded, по умолчанию 128, DropWrite —
  новое при переполнении отбрасывается, DroppedPacketsCount); один фоновый диспетчер вне замка разбирает и вызывает события ReceiveData →
  типизированные (ReceiveMicroclimateData, ReceivePowerUnitState, ReceiveStateFormatError) по одному
  и в порядке прихода, обработчики изолированы (исключение → Error). SendCommand пишет под тем же
  lockObject, WriteTimeout 500 мс. Закрытием владеет диспетчер: Close/FlushAndCloseAsync/Dispose
  под замком закрывают порт и стоп-таймер, затем публикуют один запрос pendingClose (CloseRequest
  {Drain, Done}) и будят диспетчер сентинелом WAKE; диспетчер отбрасывает/доставляет остаток
  и вызывает Disconnect. Close()/Dispose() — Disconnect АСИНХРОННЫЙ (порт закрыт по возврату,
  событие вскоре из потока доставки, не ждём); Close() из обработчика безопасен. FlushAndCloseAsync
  — ждёт доставки остатка, Disconnect, затем возврат; из обработчика — InvalidOperationException.
  Disconnect последний по построению: начатый пакет доигрывается целиком (вкл. типизированные),
  потом Disconnect. Полей жизненного цикла два: pendingClose + insideHandler (прежние
  closing/inFlight/drained удалены). Байт TOGL: Togl (сырой), Remains (int?, TX/TXF),
  ToggleCounter (int?, RX/RXF).

  Утилита noolite (Console): каркас InvokeAsync(port, Action<MTRFXXAdapter>) — Open → ExitServiceMode →
  Task.Delay(50) → команда → Task.Delay(100) → FlushAndCloseAsync, всё внутри using. Паузы нужны,
  чтобы адаптер успел отправить в эфир: FlushAndCloseAsync закрывает порт немедленно и дожидается
  только уже принятого, он паузу НЕ заменяет. Ошибки открытия порта библиотека отдаёт событием Error,
  а не исключением, поэтому каркас подписывается на Error и после Open проверяет IsOpened; ошибки
  после отправки — предупреждение в stderr, код возврата не портят. Аргументы помечены IsRequired(),
  OnValidationError печатает справку своей команды. Main — async Task<int>, один try вокруг
  ExecuteAsync: CommandParsingException → сообщение + справка + 1, прочее → сообщение без стека + 1.
  19 команд, паритет с публичным API отправки; bind-start / bind-stop / clear-channel / clear-all
  работают только в режиме RX и НЕ имеют флага -f (в библиотеке нет F-вариантов), у bind-stop
  и clear-all нет и канала. Команд чтения (state, listen) в утилите сознательно нет.
  Версия — из AssemblyInformationalVersionAttribute с отсечением «+<sha>»; в Package.xml
  выставлен IncludeSourceRevisionInInformationalVersion=false.

  Сделано (архив openspec/changes/archive/): 2026-08-16-update-to-net10, 2026-08-16-thread-safe-send,
  2026-08-16-read-state, 2026-08-18-async-receive, 2026-08-18-port-abstraction,
  2026-08-18-dispatcher-lifecycle, 2026-08-18-release-5-0. Основные спеки:
  openspec/specs/command-sending, openspec/specs/packet-receiving, openspec/specs/cli
  (последняя описывает контракт утилиты: набор команд, форма аргументов, коды возврата,
  завершение без отбрасывания принятого).

  НЕ в библиотеке: корреляция запрос↔ответ, очередь команд, реконнект, модель устройств — драйвер.

  Тестируемость адаптера: internal-шов над SerialPort — ISerialDevice (7 членов) и internal
  конструктор MTRFXXAdapter(ISerialDevice, capacity), InternalsVisibleTo для Tests; SerialPortDevice —
  обёртка над SerialPort (9600, WriteTimeout 500). В Tests: FakeSerialDevice (Feed / журнал записи
  по байту с Yield / FailRead / FailWrite), AdapterTestKit (Packets, Wait, EventLog, Gate,
  коллекция "adapter" без параллелизма). Тесты адаптера ждут сигналов с таймаутом 5 с, не спят.
  76 тестов (35 разбор + 41 адаптер). Прежний краевой случай «типизированное событие после
  Disconnect» ИСПРАВЛЕН в dispatcher-lifecycle (постоянный тест
  Close_DuringHandler_TypedEventDeliveredBeforeDisconnect). Утилита автотестами НЕ покрыта —
  проверяется справкой и дымовым прогоном на живом железе.

  Живое железо для e2e: адаптер на COM3, реле SUF-1-300 (nooLite-F, ID 33347) на канале 0,
  датчик PT-111 на канале 1. SUF-1-300 отдаёт тип устройства 5 и D3=255 при включении
  (справка для -A даёт 9 и 100 — константы из справки на железе не сходятся).

  Коммиты и документация — на русском языке.

